<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="webstore-v8-common.css">
<style>
.head{position:absolute;left:68px;top:118px;width:610px}
.row{display:flex;align-items:center;gap:26px}
h1{font-size:76px;line-height:1.02}
.sub{margin-top:26px;width:560px}
.chips{position:absolute;left:68px;top:400px;width:600px;display:flex;flex-wrap:wrap;gap:16px}
.chip{height:66px;padding:0 26px;display:flex;align-items:center;border-radius:20px;background:#fff;border:1.5px solid #d3e0f2;box-shadow:0 12px 28px rgba(17,24,39,.08);font-size:30px;font-weight:850;color:#1f2d46}
.chip.on{border-color:var(--blue);color:var(--blue);background:#eaf2ff}
.note{position:absolute;left:68px;top:636px;height:72px;padding:0 30px;font-size:26px;font-weight:800}
.panel{position:absolute;left:650px;top:-15px;width:656px;height:830px;overflow:hidden}
.panel img{position:absolute;left:-896px;top:-145px;width:1600px;max-width:none}
</style></head><body>
<div class="brand"><img src="../icons/icon128.png" alt="">AI Chat Exporter</div>
<div class="head">
  <div class="row"><span class="num">2</span><h1>Choose<br>where it goes.</h1></div>
  <p class="sub">One reply, a few, or the whole chat.</p>
</div>
<div class="chips">
  <span class="chip on">Google Docs</span><span class="chip">Word</span><span class="chip">Markdown</span><span class="chip">Notion</span><span class="chip">Obsidian</span>
</div>
<div class="pill-dark note">Your chat goes only where you send it.</div>
<div class="panel"><img src="v8-assets/panel.png" alt=""></div>
</body></html>
