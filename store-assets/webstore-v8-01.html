<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="webstore-v8-common.css">
<style>
.head{position:absolute;left:68px;top:118px;width:1144px}
.row{display:flex;align-items:center;gap:26px}
h1{font-size:86px;line-height:1}
h1 em{font-style:normal;color:var(--blue)}
h1 small{display:block;font-size:56px;line-height:1.08;margin-top:6px;font-weight:850}
.sub{margin-top:20px;width:1000px;padding-left:104px}
.hero{position:absolute;left:68px;top:420px;width:1144px;height:340px;padding:24px 48px}
.chat{display:flex;align-items:center;gap:18px}
.avatar{width:48px;height:48px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.lines{flex:1;display:grid;gap:12px}.lines i{display:block;height:16px;border-radius:99px;background:#e6edf7}.lines i:nth-child(1){width:74%}.lines i:nth-child(2){width:52%}
.bar{position:relative;margin-top:26px;width:972px;height:150px;overflow:hidden}
.bar img{position:absolute;left:-456px;top:-1040px;width:3400px;max-width:none}
.ring{position:absolute;left:var(--rx,22px);top:var(--ry,37px);width:368px;height:112px;border:6px solid var(--blue);border-radius:28px;box-shadow:0 0 0 12px rgba(26,115,232,.14)}
.tag{position:absolute;left:48px;top:262px;height:66px;padding:0 28px;font-size:32px;font-weight:850}
.tag:before{content:"";position:absolute;left:92px;top:-10px;width:22px;height:22px;background:var(--ink);transform:rotate(45deg);border-radius:4px}
</style></head><body>
<div class="brand"><img src="../icons/icon128.png" alt="">AI Chat Exporter</div>
<div class="head">
  <div class="row"><span class="num">1</span><h1>Click <em>Export</em><small>under every AI reply.</small></h1></div>
  <p class="sub">Works on the websites of ChatGPT, Gemini, Claude, DeepSeek &amp; Perplexity — in Chrome, not the apps.</p>
</div>
<div class="card hero">
  <div class="chat"><div class="avatar">AI</div><div class="lines"><i></i><i></i></div></div>
  <div class="bar"><img src="v8-assets/button.png" alt=""><div class="ring"></div></div>
  <div class="pill-dark tag">This is the Export button</div>
</div>
</body></html>
